server:
  port: 8080

logging:
  level:
    root: INFO
    io.agentscope: INFO
    org.docx4j: ERROR
    org.apache.fop: ERROR
    com.example.agentservice.procurement.tender.persistence: DEBUG

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

spring:
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# Do not put real credentials here. Use application-local.yml for local-only values.
app:
  bid:
    supplier-lookup-enabled: false
  dashscope:
    api-key: ""
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  imm:
    endpoint: ${ALIYUN_IMM_ENDPOINT:imm.cn-beijing.aliyuncs.com}
    project-name: ${ALIYUN_IMM_PROJECT:pdfReview}
  bailian:
    knowledge-enabled: ${ALIYUN_BAILIAN_KNOWLEDGE_ENABLED:false}
    workspace-id: ${ALIYUN_BAILIAN_WORKSPACE_ID:}
    knowledge-base-id: ${ALIYUN_BAILIAN_KNOWLEDGE_BASE_ID:}
  procurement-document:
    generation-model: ${PROCUREMENT_GENERATION_MODEL:qwen3.7-plus}
    max-concurrency: ${PROCUREMENT_MAX_CONCURRENCY:4}
