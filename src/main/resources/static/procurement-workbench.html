<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招标文件协同工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.1/dist/index.css">
  <style>
    :root{--c:#409eff;--text:#303133;--sub:#909399;--line:#dcdfe6;--bg:#f5f7fa;--ok:#67c23a}
    *{box-sizing:border-box}body{margin:0;font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:320px 1fr}main{padding:20px;min-width:0}
    .rail{position:sticky;top:0;height:100vh;overflow:auto;padding:20px;background:#fff;border-right:1px solid var(--line)}
    .brand{font-size:17px;font-weight:600}.brand small{display:block;color:var(--sub);font-size:11px}.rule{height:1px;margin:16px 0;background:var(--line)}
    .label,.hint{color:var(--sub);font-size:12px}.label{margin:14px 0 6px}.hint{margin-top:6px}
    .rail input,.rail textarea,.btn{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
    .rail input,.rail textarea{width:100%}.rail textarea{height:150px;resize:vertical;font:12px/1.6 Consolas,monospace}
    .btn{width:auto;cursor:pointer}.btn:hover{border-color:var(--c);color:var(--c)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .primary{border-color:var(--c);background:var(--c);color:#fff}.ghost{background:transparent}.secondary{background:var(--bg)}.wide{width:100%;margin-top:8px}
    .status{margin-top:16px;color:var(--sub);font-size:12px}.status strong{display:block;color:var(--text)}
    .steps{list-style:none;margin:12px 0 0;padding:0;color:var(--sub);font-size:12px}.steps li{position:relative;padding:4px 0 4px 18px}.steps li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border:1px solid var(--line);border-radius:50%}.steps .done{color:var(--text)}.steps .done:before{border-color:var(--ok);background:var(--ok)}
    .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 0;color:var(--sub);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px}
    .workspace{display:grid;grid-template-columns:minmax(320px,1fr) 6px minmax(320px,1fr);min-height:680px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
    .panel{display:flex;flex-direction:column;min-width:0}.panel-head{flex:none;display:flex;justify-content:space-between;align-items:center;height:38px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px}.panel-head span{color:var(--sub)}
    .splitter{background:var(--line);cursor:col-resize}.splitter:hover,.splitter.drag{background:var(--c)}
    .editor,.preview{height:638px}.editor .vditor{border:0}
    .preview{overflow:auto;padding:20px 28px;line-height:1.8}.preview h1{text-align:center}.preview h2{font-size:17px}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{padding:6px 8px;border:1px solid var(--line)}
    .versions{margin-top:16px;display:grid}.version{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.file-link{margin-left:6px;color:var(--c)}
    .download-panel{display:none;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}.download-head{font-weight:600}.file-download{text-decoration:none}
    .toast{position:fixed;right:20px;bottom:20px;padding:10px 16px;border-radius:4px;background:#303133;color:#fff;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
    .overlay{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.45);color:#fff;text-align:center}.overlay.show{display:flex}
    .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .busy-title{font-size:16px;font-weight:600}.busy-hint,.busy-dismiss{font-size:12px}.busy-hint{max-width:440px;color:#e4e7ed}.busy-dismiss{padding:8px 16px;border:1px solid #fff;border-radius:4px;background:transparent;color:#fff;cursor:pointer}
    @media(max-width:1050px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto}.workspace{grid-template-columns:1fr!important;min-height:0}.splitter{display:none}.editor,.preview{height:500px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">采 购 文 牍<small>PROCUREMENT STUDIO</small></div><div class="rule"></div>
    <div class="label">选择招标文件 HTML 模板</div><input id="outlineFile" type="file" accept=".html,.htm">
    <div class="label">结构化项目 JSON（可选）</div>
    <textarea id="projectData" spellcheck="false" placeholder='粘贴完整项目对象，例如：&#10;{&#10;  "projectName": "家具采购项目",&#10;  "purchaseMoney": "550000.00",&#10;  "classifyCode": "1",&#10;  "projectType": "1"&#10;}'></textarea>
    <div class="hint">可直接粘贴 ZbProjectCommonDto 的完整 JSON。</div>
    <button class="btn primary wide" onclick="createTask()">上传模板并生成招标初稿</button>
    <div class="label">任务 ID</div><input id="taskId" placeholder="输入或生成 taskId">
    <button class="btn ghost wide" onclick="loadAll()">载入任务</button>
    <div class="status"><strong id="statusText">尚未载入任务</strong><span id="stageText">请创建或输入任务 ID</span></div>
    <ol class="steps"><li id="s1">生成初稿</li><li id="s4">人工确认</li><li id="s5">导出产物</li></ol>
  </aside>
  <main>
    <header class="top"><div><h1>招标文件协同工作台</h1><p>上传 HTML 模板，生成初稿，人工编辑后确认定稿。</p></div>
      <div class="actions"><button class="btn primary" onclick="saveVersion()">保存人工版本</button><button class="btn ghost" onclick="finalizeCurrent()">确认定稿</button><button class="btn ghost" onclick="exportFiles()">导出文件</button></div></header>
    <section class="workspace" id="workspace">
      <article class="panel"><div class="panel-head"><b>文档编辑</b><span id="charCount">0 字</span></div><div id="editor" class="editor"></div></article>
      <div class="splitter" id="splitter" title="拖动调整两侧宽度"></div>
      <article class="panel"><div class="panel-head"><b>文档预览</b><span>滚动自动同步</span></div><div id="preview" class="preview"></div></article>
    </section>
    <section id="downloadPanel" class="download-panel"></section>
    <section id="versions" class="versions"></section>
  </main>
</div><div id="overlay" class="overlay" role="dialog" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="busy-title" id="busyTitle">正在处理</div>
    <div class="busy-hint" id="busyHint"></div>
    <button class="busy-dismiss" id="busyDismiss" onclick="dismissWaiting()">后台继续等待</button>
  </div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/vditor@3.11.1/dist/index.min.js"></script>
<script>
const base='/api/procurement/tender-drafts';let currentVersionId=null,pollTimer=null,overlayKind=null,liveTaskId=null;
const $=id=>document.getElementById(id);const task=()=>$('taskId').value.trim();
let editor;
const editorValue=()=>editor?editor.getValue():'';
editor=new Vditor('editor',{mode:'wysiwyg',lang:'zh_CN',height:638,cache:{enable:false},toolbar:['headings','bold','italic','strike','|','list','ordered-list','check','outdent','indent','|','quote','line','table','link','|','undo','redo','fullscreen'],input:render});
function bindDiffSync(){
  const pv=$('preview');
  let lock=false,edCache=null;
  const edEl=()=>{if(edCache&&edCache.isConnected)return edCache;const root=(typeof editor!=='undefined'&&editor.vditor&&editor.vditor.element)||document;return edCache=root.querySelector('.vditor-wysiwyg .vditor-reset')||root.querySelector('.vditor-wysiwyg')||root.querySelector('.vditor-content')};
  const ratio=el=>el.scrollTop/Math.max(1,el.scrollHeight-el.clientHeight);
  const follow=(src,dst)=>{if(lock||window.innerWidth<=1050)return;lock=true;dst.scrollTop=ratio(src)*(dst.scrollHeight-dst.clientHeight);requestAnimationFrame(()=>requestAnimationFrame(()=>lock=false))};
  document.addEventListener('scroll',e=>{const ed=edEl();if(ed&&e.target===ed)follow(ed,pv)},true);
  pv.addEventListener('scroll',()=>{const ed=edEl();if(ed)follow(pv,ed)});
}
bindDiffSync();
(function(){
  const ws=$('workspace'),sp=$('splitter');let drag=null;
  sp.addEventListener('mousedown',e=>{const left=ws.children[0].getBoundingClientRect().width,right=ws.children[2].getBoundingClientRect().width;drag={x:e.clientX,left,right};sp.classList.add('drag');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault()});
  window.addEventListener('mousemove',e=>{if(!drag)return;const total=drag.left+drag.right;const left=Math.min(total-280,Math.max(280,drag.left+(e.clientX-drag.x)));ws.style.gridTemplateColumns=left+'px 6px minmax(0,'+(total-left)+'px)'});
  window.addEventListener('mouseup',()=>{if(!drag)return;drag=null;sp.classList.remove('drag');document.body.style.cursor='';document.body.style.userSelect=''});
})();
async function api(url,options={}){const headers=options.body instanceof FormData?{}:{'Content-Type':'application/json'};const r=await fetch(url,{headers,...options});if(!r.ok){const text=await r.text();let message=text;try{message=JSON.parse(text).message||text}catch(e){}throw new Error(message||('HTTP '+r.status))}return r.status===204?null:r.json()}
function notify(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function setActions(on){[...document.querySelectorAll('button')].forEach(b=>b.disabled=!on);$('outlineFile').disabled=!on;$('projectData').disabled=!on}
function showOverlay(kind,title,hint){overlayKind=kind;$('busyTitle').textContent=title;$('busyHint').textContent=hint||'';setActions(false);$('busyDismiss').disabled=false;$('busyDismiss').style.display=kind==='generating'?'inline-block':'none';$('overlay').classList.add('show')}
function hideOverlay(){overlayKind=null;$('overlay').classList.remove('show');setActions(true)}
function dismissWaiting(){hideOverlay();notify('生成仍在后台进行，完成后会自动载入初稿')}
async function createTask(){
  const file=$('outlineFile').files[0];
  if(!file)return notify('请选择招标文件 HTML 模板');
  const json=$('projectData').value.trim();let parsed=null;
  if(json){try{parsed=JSON.parse(json)}catch(e){return notify('结构化项目数据不是有效 JSON')}}
  showOverlay('generating','正在上传模板并创建生成任务…','正在提交模板与项目数据，请稍候…');
  try{
    const form=new FormData();form.append('file',file);
    if(parsed)form.append('projectData',new Blob([JSON.stringify(parsed)],{type:'application/json'}));
    const created=await api(base+'/tasks/upload',{method:'POST',body:form});
    $('taskId').value=created.taskId;liveTaskId=created.taskId;
    $('busyTitle').textContent='正在生成招标初稿';
    $('busyHint').textContent='AI 正在处理模板正文，通常需要数十秒，请耐心等待…';
    watch();
  }catch(e){hideOverlay();notify('上传失败：'+(e.message||'请查看服务日志'))}
}
async function loadAll(){if(!task())return notify('请填写任务 ID');try{const data=await api(base+'/tasks/'+task()+'/result');applyResult(data);await loadVersions()}catch(e){notify('载入失败：'+(e.message||'请检查任务 ID 与服务是否可用'))}}
async function refreshResult(){const d=await api(base+'/tasks/'+task()+'/result');applyResult(d);if(['COMPLETED','FAILED'].includes(d.task.status)){clearInterval(pollTimer);pollTimer=null;return true}return false}
function watch(){clearInterval(pollTimer);pollTimer=null;refreshResult().catch(()=>{});pollTimer=setInterval(()=>refreshResult().catch(()=>{}),2500)}
function applyResult(data){
  const st=data.task.status;
  $('statusText').textContent=st;$('stageText').textContent=data.task.currentStage||'';
  currentVersionId=data.task.currentVersionId;
  if(overlayKind==='generating'){
    if(st==='COMPLETED'){hideOverlay();if(liveTaskId===data.task.taskId)liveTaskId=null;notify('初稿生成完成，可直接编辑并保存')}
    else if(st==='FAILED'){hideOverlay();if(liveTaskId===data.task.taskId)liveTaskId=null;notify('生成失败：'+(data.task.errorMessage||'请查看服务日志'))}
    else $('busyHint').textContent=(data.task.currentStage||'AI 正在生成初稿')+'…通常需要数十秒，请耐心等待';
  }else if(liveTaskId&&data.task.taskId===liveTaskId&&(st==='COMPLETED'||st==='FAILED')){liveTaskId=null;notify(st==='COMPLETED'?'初稿已生成完成并载入编辑区':'生成失败：'+(data.task.errorMessage||'请查看服务日志'))}
  if(data.draft&&(!editorValue()||$('editor').dataset.version!==currentVersionId)){editor.setValue(data.draft);$('editor').dataset.version=currentVersionId;render()}
  markSteps(data)
}
function markSteps(d){$('s1').classList.toggle('done',!!d.draft);$('s4').classList.toggle('done',d.task.currentStage==='已确认定稿')}
async function saveVersion(){
  const markdown=editorValue();
  if(!markdown.trim())return notify('正文不能为空');
  setActions(false);
  try{
    const v=await api(base+'/tasks/'+task()+'/versions',{method:'POST',body:JSON.stringify({markdown,changedBy:'web-operator'})});
    currentVersionId=v.versionId;$('editor').dataset.version=currentVersionId;
    await loadVersions();notify('人工版本已保存')
  }catch(e){notify('保存失败：'+(e.message||'请查看服务日志'))}
  finally{setActions(true)}
}
async function loadVersions(){
  const list=await api(base+'/tasks/'+task()+'/versions');
  $('versions').innerHTML=list.map(x=>{const v=x.version;return `<div class="version"><span>V${v.versionNumber} · ${esc(v.changeSource)} · ${esc(v.changedBy)}</span><span>${v.finalized?'已定稿':v.versionId.slice(0,8)}</span></div>`}).join('');
  const f=list.find(x=>x.version.finalized);
  $('s4').classList.toggle('done',!!f)
}
async function finalizeCurrent(){
  if(!currentVersionId)return notify('请先保存版本');
  setActions(false);
  try{await api(base+'/tasks/'+task()+'/versions/'+currentVersionId+'/finalize',{method:'POST'});await loadVersions();notify('已确认定稿，可点击导出文件生成 DOCX')}
  catch(e){notify('定稿失败：'+(e.message||'请查看服务日志'))}
  finally{setActions(true)}
}
function saveDownload(blob,filename){
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);link.download=filename;
  document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(link.href)
}
async function exportFiles(){
  if(!currentVersionId)return notify('请先确认定稿');
  if(overlayKind)return;
  showOverlay('exporting','正在导出文档文件…','服务端正在渲染并转换文档文件，请稍候；完成后将直接保存到本机，不会打开新标签页。');
  try{
    const response=await fetch(base+'/tasks/'+task()+'/versions/'+currentVersionId+'/artifacts/export',{method:'POST'});
    if(!response.ok)throw new Error((await response.text())||('HTTP '+response.status));
    const disposition=response.headers.get('Content-Disposition')||'';
    const matched=disposition.match(/filename\*=UTF-8''([^;]+)/i);
    saveDownload(await response.blob(),matched?decodeURIComponent(matched[1]):'招标文件.docx');
    $('s5').classList.add('done');
    notify('导出完成，Word 文件已保存到本机')
  }catch(e){notify('导出失败：'+(e.message||'请查看服务日志'))}
  finally{hideOverlay()}
}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const text=editorValue();$('charCount').textContent=text.length+' 字';const lines=text.split(/\r?\n/);let html='',inList=false;for(let i=0;i<lines.length;i++){let l=lines[i].trim();if(l.startsWith('|')&&l.endsWith('|')){let rows=[];while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(lines[i++].trim());i--;rows=rows.filter(r=>!/^\|[ :|\-]+\|$/.test(r));if(rows.length){html+='<table>';rows.forEach((r,n)=>{const tag=n?'td':'th';html+='<tr>'+r.slice(1,-1).split('|').map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>'});html+='</table>'}continue}if(/^#{1,3} /.test(l)){if(inList){html+='</ul>';inList=false}const n=l.match(/^#+/)[0].length;html+=`<h${n}>${inline(l.slice(n+1))}</h${n}>`}else if(/^(- |\d+\. )/.test(l)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inline(l.replace(/^(- |\d+\. )/,''))+'</li>'}else if(l){if(inList){html+='</ul>';inList=false}html+='<p>'+inline(l)+'</p>'}}if(inList)html+='</ul>';$('preview').innerHTML=html}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/&lt;br&gt;/g,'<br>')}
</script></body></html>
